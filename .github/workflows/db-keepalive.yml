name: Keep Render Postgres Awake

on:
  schedule:
    # Every 4 hours (UTC). Offsets from Streamlit keepalive (every 6h).
    - cron: '30 */4 * * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary

      - name: Ping database (wake Render Postgres if sleeping)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python <<'EOF'
          import os
          import sys
          import time
          from sqlalchemy import create_engine, text

          url = os.environ.get("DATABASE_URL")
          if not url:
              print("ERROR: DATABASE_URL secret is not set in GitHub repo Settings → Secrets.")
              sys.exit(1)

          if "render.com" in url and "sslmode=" not in url:
              sep = "&" if "?" in url else "?"
              url = f"{url}{sep}sslmode=require"

          max_retries = 5
          retry_delay = 15

          for attempt in range(1, max_retries + 1):
              try:
                  print(f"Attempt {attempt}/{max_retries}: connecting...")
                  engine = create_engine(
                      url,
                      pool_pre_ping=True,
                      connect_args={"connect_timeout": 30},
                  )
                  with engine.connect() as conn:
                      row = conn.execute(text("SELECT 1")).scalar()
                  print(f"Database ping OK (SELECT 1 → {row})")
                  sys.exit(0)
              except Exception as e:
                  print(f"Attempt {attempt} failed: {e}")
                  if attempt < max_retries:
                      print(f"Waiting {retry_delay}s (database may be waking)...")
                      time.sleep(retry_delay)

          print("ERROR: Database unreachable after all retries.")
          sys.exit(1)
          EOF
