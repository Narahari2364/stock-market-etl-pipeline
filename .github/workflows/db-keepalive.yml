name: Keep Render Postgres Awake

on:
  schedule:
    # Every 4 hours (UTC). Offsets from Streamlit keepalive (every 6h).
    - cron: '30 */4 * * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: DATABASE_URL"
            echo "Value: Render Dashboard → Postgres → Connect → External Database URL"
            exit 1
          fi
          echo "DATABASE_URL secret is set (value hidden)."

      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary

      - name: Ping database (wake Render Postgres if sleeping)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python <<'EOF'
          import os
          import sys
          import time
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]

          if "render.com" in url and "sslmode=" not in url:
              sep = "&" if "?" in url else "?"
              url = f"{url}{sep}sslmode=require"

          max_retries = 8
          retry_delay = 20

          for attempt in range(1, max_retries + 1):
              try:
                  print(f"Attempt {attempt}/{max_retries}: connecting...")
                  engine = create_engine(
                      url,
                      pool_pre_ping=True,
                      connect_args={"connect_timeout": 30},
                  )
                  with engine.connect() as conn:
                      row = conn.execute(text("SELECT 1")).scalar()
                  print(f"Database ping OK (SELECT 1 → {row})")
                  sys.exit(0)
              except Exception as e:
                  print(f"Attempt {attempt} failed: {e}")
                  if attempt < max_retries:
                      print(f"Waiting {retry_delay}s (database may be waking)...")
                      time.sleep(retry_delay)

          print("ERROR: Database unreachable after all retries.")
          print("If this persists, open Render Dashboard and resume or recreate the Postgres instance.")
          sys.exit(1)
          EOF
